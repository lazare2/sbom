# SBOM Platform — build from source.
#
# This file builds the images from this checkout, which is what a `git clone`
# deployment and local Docker development both want:
#
#   docker compose up -d --build
#
# deploy/docker-compose.yml is the other half of the pair: it never builds, and
# pulls published images instead. Both declare `name: sbom-platform` and the same
# three volumes, so they attach to the same data — you can switch between
# building here and pulling there without losing anything.
name: sbom-platform

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sbom
      # Defaulted so a dev checkout runs with no .env fiddling. Set it in .env on
      # any machine other people can reach.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sbom}
      POSTGRES_DB: sbom
    ports:
      # Bound to loopback deliberately. Publishing 5432 on all interfaces would
      # expose the database to the whole network — with the default password
      # above, to anyone on it. Local tools (psql, drizzle-kit, the smoke test)
      # reach it on localhost exactly as before.
      # Host port from .env, because Windows reserves scattered ranges for Hyper-V and
      # WinNAT: 5432 can be unbindable on a machine where nothing is using it, and the
      # error ("access permissions") does not say so. Changing it here meant editing this
      # file again after every source update, and that edit is easy to forget.
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sbom -d sbom"]
      interval: 5s
      timeout: 5s
      retries: 10

  # No mail service. User "emails" are login identifiers rather than mailboxes,
  # so nothing is ever sent — password recovery is an admin issuing a credential
  # through the admin panel. An earlier revision ran mailpit here to catch
  # reset links; there are none to catch.

  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://sbom:${POSTGRES_PASSWORD:-sbom}@db:5432/sbom
      API_PORT: "3000"
      API_HOST: 0.0.0.0
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      INGEST_TOKENS: ${INGEST_TOKENS:-}
      BLOB_STORE_DRIVER: ${BLOB_STORE_DRIVER:-fs}
      BLOB_STORE_FS_ROOT: /data/sboms
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      # Vulnerability scanning. Grype ships in the image; the database does not — it is
      # ~1.9 GB expanded, so it lives on the volume below and is fetched at runtime when
      # an administrator enables scanning. Nothing is downloaded on a fresh start.
      # Outbound proxy, for "Update now" on a network that requires one.
      #
      # A container inherits nothing from the host's browser or system proxy settings, which
      # is why the admin panel can report no connection on a machine whose browser reaches
      # grype.anchore.io perfectly well: the browser and this service are two different
      # clients, and only one of them was told about the proxy. Grype is a Go binary and
      # honours these standard variables; empty means direct, which is the default.
      #
      # Keep `db` in NO_PROXY so nothing internal is routed to an external proxy.
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,db,api,web}
      # Lowercase too: some clients read only these.
      http_proxy: ${HTTP_PROXY:-}
      https_proxy: ${HTTPS_PROXY:-}
      no_proxy: ${NO_PROXY:-localhost,127.0.0.1,db,api,web}
      GRYPE_DB_CACHE_DIR: /data/grype-db
      # Point this at an internal mirror to keep database traffic inside the network.
      GRYPE_DB_UPDATE_URL: ${GRYPE_DB_UPDATE_URL:-https://grype.anchore.io/databases}
      # For a mirror behind a TLS-inspecting proxy or a private CA.
      GRYPE_DB_CA_CERT: ${GRYPE_DB_CA_CERT:-}
    ports:
      # Loopback only: nginx in `web` proxies /api, so nothing outside this host
      # needs the API directly. Change to "3000:3000" to point CI at it without
      # going through nginx.
      - "127.0.0.1:${API_HOST_PORT:-3000}:3000"
    volumes:
      - sbom-blobs:/data/sboms
      # Allow ~4 GB: the database is 1.9 GB expanded, and a replacement briefly holds
      # the old copy alongside the new archive and its expansion.
      - grype-db:/data/grype-db
      # Read-only mount for a corporate / private CA, for GRYPE_DB_CA_CERT.
      #
      # A TLS-inspecting proxy re-signs every connection with its own authority, and grype
      # trusts only the CAs it knows, so the download fails with "certificate signed by
      # unknown authority" no matter how correct the proxy settings are. Pointing
      # GRYPE_DB_CA_CERT at a path is not enough on its own -- the file has to exist inside
      # the container, which is what this mount is for.
      #
      # The default source is a directory committed to the repository precisely so this
      # mount always resolves: Compose cannot make a bind mount conditional, and a missing
      # source is a hard startup failure rather than a skipped option. Empty by default,
      # so it changes nothing until a certificate is put there.
      - ${GRYPE_CA_DIR:-./deploy/ca}:/certs:ro

  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${SBOM_PORT:-8080}:80"

volumes:
  db-data:
  sbom-blobs:
  grype-db:
