server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compress the JS/CSS bundles and JSON responses. The SBOM download endpoint
    # benefits most: CycloneDX JSON is extremely repetitive.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Hashed asset filenames are immutable, so they can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or a deploy leaves browsers loading the old
    # bundle by name and every asset request 404s.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Proxy the API so the browser sees one origin and the session cookie needs no
    # CORS handling. `api` is the service name in docker-compose.
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SBOM uploads are multi-MB; the default 1m would reject them at the proxy
        # before the API's own limit could produce a useful error.
        client_max_body_size 128m;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }

    location = /health {
        proxy_pass http://api:3000/health;
        access_log off;
    }

    # SPA fallback: any unmatched path renders the app, which then routes client
    # side. Must come last so it does not shadow the rules above.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
