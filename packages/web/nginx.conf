server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS, and the reason the two proxy_pass directives below go
    # through a variable.
    #
    # nginx resolves a literal hostname in proxy_pass exactly once, at startup, and then
    # keeps the address forever. Recreating the api container -- which `docker compose up
    # -d` does on every upgrade -- gives it a new address, and nginx goes on proxying to
    # the old one. The result is a site that answers 502 on every API call until somebody
    # restarts this container too, with nothing in either container's log to say why: the
    # API is healthy, the page loads, and only the requests fail.
    #
    # A variable in proxy_pass defers the lookup to request time, which makes this
    # resolver the thing that answers it. `valid` caps how long an address is reused, so a
    # recreated container is picked up within ten seconds rather than never.
    #
    # ipv6=off because Docker's resolver answers AAAA queries for names that have no IPv6
    # address, and nginx then reports the resulting failure rather than falling back.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # One spelling of the upstream, evaluated per request. Server scope so both the API
    # and health proxies below use the same value.
    set $api_upstream http://api:3000;

    # Compress the JS/CSS bundles and JSON responses. The SBOM download endpoint
    # benefits most: CycloneDX JSON is extremely repetitive.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Hashed asset filenames are immutable, so they can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or a deploy leaves browsers loading the old
    # bundle by name and every asset request 404s.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Proxy the API so the browser sees one origin and the session cookie needs no
    # CORS handling. `api` is the service name in docker-compose.
    location /api/ {
        # No URI part, so the request URI is passed through unchanged -- the same
        # behaviour as the literal form this replaced.
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Must not be lower than the API's own GRYPE_DB_MAX_UPLOAD_BYTES (1 GiB by
        # default). This was 128m, sized for SBOM uploads before the vulnerability
        # database could be installed by hand -- and that archive is ~145 MB, so nginx
        # rejected it here and the API never saw the request. Worse, a body rejected
        # mid-upload closes the connection, which a browser reports as "failed to fetch"
        # rather than as a status, so the size-specific error the API raises for exactly
        # this case could never reach the person uploading. A proxy limit below the
        # application's is not a safety margin; it is an error message thrown away.
        client_max_body_size 1g;
        proxy_request_buffering off;
        # Long enough for the database import, which expands ~1.9 GB and validates it
        # before swapping. Matches GRYPE_DB_UPDATE_TIMEOUT_MS (30 min) for the same
        # reason as the size above: whichever limit is lower is the one that decides,
        # and it should not be the one that cannot explain itself.
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    location = /health {
        proxy_pass $api_upstream/health;
        access_log off;
    }

    # SPA fallback: any unmatched path renders the app, which then routes client
    # side. Must come last so it does not shadow the rules above.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
