[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sast-tool"
version = "0.1.0"
description = "A static application security testing (SAST) tool for Python codebases."
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
sast = "sast.cli:main"

[tool.setuptools.packages.find]
include = ["sast", "sast.*"]

[tool.setuptools.package-data]
sast = ["rules/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
